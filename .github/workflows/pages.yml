name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (high wireframe)
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build Next.js (high wireframe)
        working-directory: web
        run: npm run build
        env:
          NODE_ENV: production

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy
          # 既存の low wireframe HTML をルートに残す
          cp solmu-kyoto-ja_mid-wifi-ja_rev2_20260313.html deploy/
          # 最新版 rev3 を追加
          cp solmu-kyoto-ja_mid-wifi-ja_rev3_20260518.html deploy/
          # 最新版 rev4 を追加
          cp solmu-kyoto-ja_mid-wifi-ja_rev4_20260519.html deploy/
          # 最新版 rev5 を追加
          cp solmu-kyoto-ja_mid-wifi-ja_rev5_20260519.html deploy/
          # 最新版 rev6 を追加
          cp solmu-kyoto-ja_mid-wifi-ja_rev6_20260519.html deploy/
          # 最新版 rev7 を追加
          cp solmu-kyoto-ja_mid-wifi-ja_rev7_20260519.html deploy/
          # 最新版 rev8 を追加
          cp solmu-kyoto-ja_mid-wifi-ja_rev8_20260519.html deploy/
          # 最新版 rev9 を追加
          cp solmu-kyoto-ja_mid-wifi-ja_rev9_20260519.html deploy/
          # 最新版 rev10 を追加
          cp solmu-kyoto-ja_rev10_20260611.html deploy/
          # ランディング index.html（low / high の入口）
          cp index.html deploy/
          # high wireframe を /high-wireframe/ に配置
          mkdir -p deploy/high-wireframe
          cp -r web/out/* deploy/high-wireframe/
          # Jekyll を抑止
          touch deploy/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - uses: actions/deploy-pages@v4
        id: deployment
